<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Picker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
      <h1><span class="arcade">🎮</span>Game-Picker</h1>
    <h2 class="SignupTitle">로그인</h2>
    <nav class="NavMenu">
        <a href="게임추천.html">홈</a>
        <a href="오늘의게임.html">오늘의 추천 게임</a>
        <a href="장르별추천.html">장르별 추천</a>
        <a href="회원가입.html">회원가입</a>
        <a href="로그인.html">로그인</a>
    </nav>
     <div class="Login">
    <form id="loginForm" novalidate>
        <label>아이디</label>
        <input type="text" id="loginId" placeholder="아이디를 입력하세요.">

        <label>비밀번호</label>
        <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요.">

        <div class="Checkbox">
            <input type="checkbox" id="loginRobot">
            <span>로봇이 아닙니다.</span>
        </div>

        <p id="loginMessage" class="FormMessage"></p>

        <button type="submit" class="LoginButton">로그인</button>

        <p class="LoginText">
            아직 회원이 아니신가요? <a href="회원가입.html">회원가입하기</a>
        </p>
    </form>
</div>
    
<script src="js/script.js"></script>    
</body>
</html>
