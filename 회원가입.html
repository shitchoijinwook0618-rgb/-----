<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Picker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1><span class="arcade">🎮</span>Game-Picker</h1>
    <h2 class="SignupTitle">회원가입</h2>
    <nav class="NavMenu">
        <a href="index.html">홈</a>
        <a href="오늘의게임.html">오늘의 추천 게임</a>
        <a href="장르별추천.html">장르별 추천</a>
        <a href="회원가입.html">회원가입</a>
        <a href="로그인.html">로그인</a>
    </nav>

    <div class="Signup">
        <form>
            <label>아이디</label>
            <input type="text" placeholder="아이디를 입력하세요.">

            <label>비밀번호</label>
            <input type="password" placeholder="비밀번호를 입력하세요">

            <label>비밀번호 확인</label>
            <input type="password" placeholder="비밀번호를 다시 입력하세요">

            <label>이름</label>
            <input type="text" placeholder="이름을 입력하세요">

            <label>이메일</label>
            <input type="text" placeholder="이메일을 입력하세요">
            <div class="Checkbox">
                <input type="checkbox">
                <span>이메일 수신에 동의합니다.</span>
            </div>

            <div class="Checkbox">
                <input type="checkbox">
                <span>로봇이 아닙니다.</span>
            </div>
            <button type="button">회원가입</button>
        </form>
    </div>
<script src="js/script.js"></script>    
</body>
</html>
