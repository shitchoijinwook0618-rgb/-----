<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Picker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1><span class="arcade">🎮</span>Game-Picker</h1>

    <h2 class="SignupTitle">장르별 추천</h2>

    <nav class="NavMenu">
        <a href="index.html">홈</a>
        <a href="오늘의게임.html">오늘의 추천 게임</a>
        <a href="장르별추천.html">장르별 추천</a>
        <a href="회원가입.html">회원가입</a>
        <a href="로그인.html">로그인</a>
    </nav>

    <section class="GenreRecommend">
        <h3>원하는 장르를 선택해보세요!</h3>

        <select id="genreSelect">
            <option value="">장르를 선택하세요</option>
            <option value="rpg">RPG</option>
            <option value="healing">힐링</option>
            <option value="story">스토리</option>
            <option value="openworld">오픈월드</option>
        </select>

        <div id="genreResult" class="GenreResult">
            장르를 선택하면 추천 게임이 표시됩니다.
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
